<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elections Management - Admin Dashboard</title>
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.2rem;
        margin-top: 1.5rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader"></div>
      <div class="loading-text">Loading...</div>
    </div>
    <div id="app">
      <header>
        <div>
          <h1>Elections Management</h1>
          <p>Create and manage elections</p>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <a href="/dashboard.html" class="btn-secondary">Back to Dashboard</a>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </header>
      
      <main>
        <section class="election-create">
          <h2>Create New Election</h2>
          <form id="create-election-form">
            <div class="form-group">
              <label for="election-name">Election Name *</label>
              <input type="text" id="election-name" required placeholder="e.g., Presidential Election 2024">
            </div>
            <div class="form-group">
              <label for="election-description">Description *</label>
              <textarea id="election-description" required placeholder="Election description" rows="3"></textarea>
            </div>
            <div class="form-group">
              <label>Voting Options *</label>
              <div id="options-container">
                <div class="option-input">
                  <input type="text" class="option-field" placeholder="Option 1" required>
                  <button type="button" class="btn-remove-option" title="Remove option">×</button>
                </div>
              </div>
              <button type="button" id="add-option-btn">+ Add Option</button>
            </div>
            <button type="submit" class="btn-primary">Create Election</button>
          </form>
        </section>

        <section id="elections">
          <h2>All Elections</h2>
          <div id="elections-container">
            <p>Loading elections...</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/elections.ts"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-screen').classList.add('hidden');
          setTimeout(function() {
            document.getElementById('loading-screen').remove();
          }, 300);
        }, 100);
      });
    </script>
  </body>
</html>
