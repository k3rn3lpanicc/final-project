<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Vote Scheme</title>
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.2rem;
        margin-top: 1.5rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader"></div>
      <div class="loading-text">Loading Dashboard...</div>
    </div>
    <div id="app">
      <header>
        <div>
          <h1>Admin Dashboard</h1>
          <p>Manage voter registration requests</p>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <a href="/elections.html" class="btn-secondary">Manage Elections</a>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </header>
      
      <main>
        <section id="stats">
          <div class="stat-card">
            <h3>Pending Requests</h3>
            <p id="pending-count">0</p>
          </div>
          <div class="stat-card">
            <h3>Approved</h3>
            <p id="approved-count">0</p>
          </div>
          <div class="stat-card">
            <h3>Rejected</h3>
            <p id="rejected-count">0</p>
          </div>
          <div class="stat-card">
            <h3>Auto-Rejected</h3>
            <p id="auto-rejected-count">0</p>
          </div>
        </section>

        <section id="requests">
          <h2>Registration Requests</h2>
          <div class="filters">
            <button class="filter-btn active" data-status="all">All</button>
            <button class="filter-btn" data-status="pending">Pending</button>
            <button class="filter-btn" data-status="approved">Approved</button>
            <button class="filter-btn" data-status="rejected">Rejected</button>
            <button class="filter-btn" data-status="auto_rejected">Auto-Rejected</button>
          </div>
          <div class="election-filter-container" style="margin-top: 1rem;">
            <label for="election-filter" style="margin-right: 0.5rem; font-weight: 500;">Filter by Election:</label>
            <select id="election-filter" class="election-filter-select">
              <option value="">All Elections</option>
            </select>
          </div>
          <div id="requests-container">
            <p>Loading requests...</p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-screen').classList.add('hidden');
          setTimeout(function() {
            document.getElementById('loading-screen').remove();
          }, 300);
        }, 100);
      });
    </script>
  </body>
</html>
