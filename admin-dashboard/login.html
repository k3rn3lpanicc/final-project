<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Vote Scheme</title>
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0d1117 0%, #0a0e12 50%, #0d1117 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }
      #loading-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .loader {
        width: 50px;
        height: 50px;
        border: 5px solid #1c2128;
        border-top-color: #2ecc71;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.2rem;
        margin-top: 1.5rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader"></div>
      <div class="loading-text">Loading...</div>
    </div>
    <div id="login-app">
      <div class="login-container">
        <div class="login-card">
          <h1>Admin Login</h1>
          <p class="subtitle">Vote Scheme Management System</p>
          
          <form id="login-form">
            <div class="form-group">
              <label for="username">Username</label>
              <input 
                type="text" 
                id="username" 
                name="username" 
                required 
                autocomplete="username"
                placeholder="Enter your username"
              />
            </div>
            
            <div class="form-group">
              <label for="password">Password</label>
              <input 
                type="password" 
                id="password" 
                name="password" 
                required 
                autocomplete="current-password"
                placeholder="Enter your password"
              />
            </div>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <button type="submit" id="login-btn" class="login-btn">
              <span id="login-text">Sign In</span>
              <span id="login-spinner" class="spinner" style="display: none;"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
    <script type="module" src="/src/login.ts"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          document.getElementById('loading-screen').classList.add('hidden');
          setTimeout(function() {
            document.getElementById('loading-screen').remove();
          }, 300);
        }, 100);
      });
    </script>
  </body>
</html>
